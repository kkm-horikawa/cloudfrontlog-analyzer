services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudfront-analyzer-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount AWS credentials (read-only)
      - ~/.aws:/root/.aws:ro
      # Mount CloudFront log cache directory
      - ./.cache/cloudfront_logs:/app/.cache/cloudfront_logs
      # Mount backend code for development (optional, comment out for production)
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - CLOUDFRONT_LOG_CACHE_DIR=/app/.cache/cloudfront_logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudfront-analyzer-frontend
    ports:
      - "5173:5173"
    volumes:
      # Mount frontend code for development (optional, comment out for production)
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
